server {
    server_name srv1903626.hstgr.cloud;

    # data.js is 4.2 MB of JSON. gzip_proxied is required -- without it nginx refuses to
    # compress anything it got from an upstream, which is every byte this server serves.
    #
    # `text/javascript` is on the list because THE UPSTREAM DECIDES THE TYPE, and the
    # upstream is Python. `api_board._serve` labels a file with `mimetypes.guess_type`,
    # and Python 3.12 answers `text/javascript` for `.js` where nginx's own mime.types
    # says `application/javascript`. A list written against nginx's spelling therefore
    # matched the CSS and the JSON and silently skipped the two biggest files on the
    # page: 4,156,352 bytes of data.js shipped raw where 585,080 would do, plus 263,788
    # of app.js for 87,172 -- ~3.7 MB per cold load. Measured against the client the
    # board is actually read from, that is two minutes of a blank page. Nothing logged
    # it, because an uncompressed response is a correct response.
    #
    # text/html is deliberately absent: nginx always compresses it and listing it is a
    # no-op. That is why index.html was already arriving at 1,303 of its 2,359 bytes.
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript application/x-javascript
               application/json text/css text/plain image/svg+xml;

    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The /ws stream is idle between ticks; the default 60s would cut it every minute.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/srv1903626.hstgr.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/srv1903626.hstgr.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = srv1903626.hstgr.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name srv1903626.hstgr.cloud;
    return 404; # managed by Certbot


}
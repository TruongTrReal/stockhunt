<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>API · Stockhunt desk</title>
<!--
  The API reference, and it holds NO PROSE OF ITS OWN. Every word on this page is fetched
  from `/desk/agent.md` and rendered here.

  That is the whole point of the file. The same contract is read by two audiences — a
  person scrolling it and a model being handed it — and writing it twice guarantees the
  two drift, with the machine-readable copy being the one nobody proofreads. So there is
  one document: this page is a renderer, `/desk/agent.md` is the source, and "copy as
  markdown" hands over the identical bytes.

  Self-contained, like `login.html` and `desk.html`, and for the same reason: this folder's
  pages must never depend on `../Stockhunt Dashboard/web/`, which is build output.
-->
<style>
  :root{
    color-scheme: light dark;
    --paper:#FCFCFA; --ink:#16161A; --ink-2:#3F3F46; --muted:#78787F;
    --hair:#E4E4DE; --hair-2:#CFCFC8; --loss:#B0402F; --live:#2C6E52; --sunk:#F4F4F0;
    --sans:ui-sans-serif,system-ui,"Segoe UI",-apple-system,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
    --col:clamp(16px,4vw,34px);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0B0B0C; --ink:#F1F1EE; --ink-2:#C3C3C0; --muted:#84848C;
      --hair:#232327; --hair-2:#33333A; --loss:#E08472; --live:#6BBF95; --sunk:#131316;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;
    line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  /* Copied from the board's `app.css`, number for number, and from `desk.html`, which
     copies the same thing. These links navigate between two processes, so a rail or a gap
     that differs by a few pixels shows up as the nav moving when you switch pages. Same
     rule as there: the active link recolours and underlines, and never re-weights. */
  .top{border-bottom:1px solid var(--hair)}
  .top-in{max-width:1240px;margin:0 auto;padding:18px var(--col) 0;
          display:flex;flex-direction:column;gap:14px}
  .brand{font-size:13px;letter-spacing:.02em;color:var(--muted)}
  .brand b{color:var(--ink);font-weight:600}
  .nav{display:flex;gap:22px}
  .nav a{font-size:14px;color:var(--muted);text-decoration:none;padding-bottom:9px;
         border-bottom:2px solid transparent}
  .nav a:hover{color:var(--ink)}
  .nav a.on{color:var(--ink);border-bottom-color:var(--ink)}

  /* On the same rail as the masthead, so the table of contents starts where the nav does
     rather than 100px to the right of it. */
  .wrap{display:flex;gap:44px;max-width:1240px;margin:0 auto;padding:34px var(--col) 100px}
  .toc{width:196px;flex:0 0 auto;position:sticky;top:24px;align-self:flex-start;
       font-size:13px;max-height:calc(100vh - 48px);overflow-y:auto}
  .toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 0;
         border-left:2px solid transparent;padding-left:10px;margin-left:-12px}
  .toc a:hover{color:var(--ink)}
  .toc a.on{color:var(--ink);font-weight:600;border-left-color:var(--ink)}
  .toc a.sub{padding-left:22px;font-size:12.5px}
  @media(max-width:820px){ .toc{display:none} .wrap{gap:0} }

  /* The rail is wider than this page's measure; the prose keeps its own. */
  .doc{flex:1;min-width:0;max-width:820px}
  .doc h1{font-size:25px;font-weight:600;letter-spacing:-.015em;margin:0 0 18px}
  .doc h2{font-size:18px;font-weight:600;margin:40px 0 12px;padding-top:10px;
          border-top:1px solid var(--hair)}
  .doc h3{font-size:14.5px;font-weight:600;margin:26px 0 8px}
  .doc p{font-size:14.5px;color:var(--ink-2);margin:0 0 14px;max-width:70ch}
  .doc strong{color:var(--ink);font-weight:600}
  .doc hr{border:0;border-top:1px solid var(--hair);margin:34px 0}
  .doc code{font-family:var(--mono);font-size:13px;background:var(--sunk);padding:1px 5px;
            border-radius:3px;color:var(--ink)}
  .doc pre{background:var(--sunk);border:1px solid var(--hair);border-radius:6px;
    padding:15px 17px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;
    line-height:1.65;color:var(--ink-2);margin:0 0 18px}
  .doc pre code{background:none;padding:0;font-size:inherit;color:inherit}

  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--hair-2);
    border-radius:6px;padding:13px 15px;margin-bottom:30px;font-size:13.5px;color:var(--ink-2)}
  .bar b{color:var(--ink)}
  .bar .spacer{flex:1}
  button{font-family:var(--sans);font-size:12px;padding:5px 11px;border-radius:4px;
    border:1px solid var(--hair-2);background:transparent;color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--ink)}
  .fail{border-left:2px solid var(--loss);padding-left:12px;color:var(--loss);font-size:14px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <span class="brand"><b>stockhunt</b> // truong's dashboard</span>
    <nav class="nav">
      <a href="/#/paper">Paper trading</a>
      <a href="/#/backtest">Backtest</a>
      <a href="/desk">My desk</a>
      <a href="/desk/docs" class="on">API</a>
    </nav>
  </div>
</header>

<div class="wrap">
  <nav class="toc" id="toc"></nav>
  <article class="doc">
    <div class="bar">
      <b>Connecting an agent?</b>
      <span>This page is one markdown file. Hand it over whole.</span>
      <span class="spacer"></span>
      <button id="copy">Copy as markdown</button>
      <button id="raw">Open /desk/agent.md</button>
    </div>
    <div id="doc">Loading…</div>
  </article>
</div>

<script>
"use strict";
const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// A markdown subset, matched to what `agent.md` actually uses: ATX headings, fenced and
// indented code, `---`, `**bold**`, `` `code` ``. Deliberately not a general renderer —
// the input is one file in this repo, not user content, and a hundred lines of parser
// nobody needs is a hundred lines that can be wrong.
function render(md) {
  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  const toc = [];
  let para = [], fence = null, code = [];

  const flushPara = () => {
    if (!para.length) return;
    out.push("<p>" + inline(para.join(" ")) + "</p>");
    para = [];
  };
  const flushCode = () => {
    if (!code.length) return;
    // Trailing blank lines inside an indented block are the separator, not content.
    while (code.length && !code[code.length - 1].trim()) code.pop();
    out.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
    code = [];
  };
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
    .replace(/\*\*([^*]+)\*\*/g, (_, c) => `<strong>${c}</strong>`);
  const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  for (const raw of lines) {
    if (fence !== null) {                       // inside ```
      if (raw.trim().startsWith("```")) { flushCode(); fence = null; }
      else code.push(raw);
      continue;
    }
    if (raw.trim().startsWith("```")) { flushPara(); fence = raw; continue; }

    if (/^ {4}\S/.test(raw) || (code.length && !raw.trim())) {   // indented block
      flushPara();
      code.push(raw.replace(/^ {4}/, ""));
      continue;
    }
    flushCode();

    const h = raw.match(/^(#{1,3})\s+(.*)$/);
    if (h) {
      flushPara();
      const n = h[1].length, text = h[2].trim(), id = slug(text);
      if (n > 1) toc.push({n, text, id});
      out.push(`<h${n} id="${id}">${inline(text)}</h${n}>`);
      continue;
    }
    if (/^---+\s*$/.test(raw)) { flushPara(); out.push("<hr>"); continue; }
    if (!raw.trim()) { flushPara(); continue; }
    para.push(raw.trim());
  }
  flushCode(); flushPara();

  el("doc").innerHTML = out.join("\n");
  el("toc").innerHTML = toc.map(t =>
    `<a href="#${t.id}" class="${t.n === 3 ? "sub" : ""}" data-id="${t.id}">${esc(t.text)}</a>`
  ).join("");
  spy();
}

// Which heading is on screen. `IntersectionObserver` rather than a scroll handler: the
// browser does the work, and it is right on a fast scroll where a debounce is not.
function spy() {
  const links = new Map([...el("toc").children].map(a => [a.dataset.id, a]));
  const seen = new Set();
  const io = new IntersectionObserver(entries => {
    for (const e of entries) e.isIntersecting ? seen.add(e.target.id) : seen.delete(e.target.id);
    let first = null;
    for (const a of links.keys()) if (seen.has(a)) { first = a; break; }
    links.forEach((a, id) => a.classList.toggle("on", id === first));
  }, {rootMargin: "0px 0px -75% 0px"});
  links.forEach((_, id) => { const h = document.getElementById(id); if (h) io.observe(h); });
}

let SOURCE = "";
el("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(SOURCE); el("copy").textContent = "Copied"; }
  catch { el("copy").textContent = "Press Ctrl+C"; }
  setTimeout(() => el("copy").textContent = "Copy as markdown", 1600);
};
el("raw").onclick = () => { location.href = "/desk/agent.md"; };

(async () => {
  const res = await fetch("/desk/agent.md", {credentials: "same-origin"});
  if (res.status === 401) { location.href = "/login"; return; }
  if (!res.ok) {
    el("doc").innerHTML = `<p class="fail">The reference could not be loaded (${res.status}).</p>`;
    return;
  }
  SOURCE = await res.text();
  render(SOURCE);
})();
</script>
</body>
</html>
